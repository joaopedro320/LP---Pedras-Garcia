<script>

  var link = qh4WaLink(msg);

  btn.addEventListener("click", function () { qh4Track("whatsapp_click", { wa_local: "obrigado" }); });

  qh4Track("thank_you_view", { form_id: "orcamento" });
  /* ==========================================================================
     [QH4 SLOT 8] CONVERSÃO DA PÁGINA DE OBRIGADO
     Com GTM: nada aqui. Crie a tag de conversão com o acionador de evento "thank_you_view".
     Sem GTM: o tracking.js já dispara fbq('track','Lead') e a conversão do Google Ads
     (se googleAdsConversao estiver preenchido no SLOT 7). Código extra de conversão vai aqui.
     ========================================================================== */

  var n = 4, el = document.getElementById("contador");
  var t = setInterval(function () {
    n--; el.textContent = n;
    if (n <= 0) { clearInterval(t); window.location.href = link; }
  }, 1000);
})();
</script>
